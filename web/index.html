<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030407" />
    <title>Rewind: every discovery has a past</title>
    <meta name="description" content="When a new comet or asteroid is discovered, Rewind looks for it in older NASA SPHEREx photos, taken before anyone knew it was there. Then its future path becomes more certain." />

  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-label="3D view of the solar system with asteroids"></canvas>
      <div id="poster" aria-hidden="true"></div>
      <div id="labels" aria-hidden="true"></div>
      <div id="ui"></div>
    </div>
    <noscript>Rewind needs JavaScript and WebGL to show the 3D solar system.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
