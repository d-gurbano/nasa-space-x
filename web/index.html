<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030407" />
    <title>Rewind · Finding recently discovered asteroids and comets in older SPHEREx images</title>
    <meta name="description" content="Rewind searches NASA SPHEREx survey images for precovery detections of recently discovered asteroids and comets. A precovery is an image of the object taken before its first known observation." />

  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-label="3D view of the solar system with asteroids"></canvas>
      <div id="poster" aria-hidden="true"></div>
      <div id="labels" aria-hidden="true"></div>
      <div id="ui"></div>
    </div>
    <noscript>Rewind needs JavaScript and WebGL to show the 3D solar system.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
